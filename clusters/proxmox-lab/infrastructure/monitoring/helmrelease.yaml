apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "89.2.4"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h

  values:
    alertmanager:
      enabled: false

    grafana:
      nodeSelector:
        kubernetes.io/hostname: rke2-worker01

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

      persistence:
        enabled: true
        type: sts
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        size: 2Gi

      ingress:
        enabled: false

    prometheus:
      prometheusSpec:
        replicas: 1
        retention: 3d
        retentionSize: 6GB

        nodeSelector:
          kubernetes.io/hostname: rke2-worker01

        resources:
          requests:
            cpu: 150m
            memory: 512Mi
          limits:
            memory: 1Gi

        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 8Gi

    kube-state-metrics:
      nodeSelector:
        kubernetes.io/hostname: rke2-worker01

    prometheusOperator:
      nodeSelector:
        kubernetes.io/hostname: rke2-worker01
