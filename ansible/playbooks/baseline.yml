---
- name: Configure Linux baseline
  hosts: lab
  gather_facts: true
  become: true

  tasks:
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - curl
          - vim
          - git
          - jq
          - ca-certificates
          - gnupg
        state: present

    - name: Set timezone to UTC
      community.general.timezone:
        name: UTC
